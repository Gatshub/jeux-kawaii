[workspace]
resolver = "2"
members = [
    "jeux-core",
    "motus",
    "fubuki",
    "takuzu",
    "invaders",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Cyril"]

[workspace.dependencies]
ratatui = "0.29"
crossterm = "0.28"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
